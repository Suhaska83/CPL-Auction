name: Deploy Firebase RTDB rules

on:
  push:
    branches: [main]
    paths:
      - "web-static/database.rules.json"
      - "web-static/.firebaserc"
      - "web-static/firebase.json"
      - ".github/workflows/deploy-firebase-rules.yml"
  workflow_dispatch:

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-static
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Realtime Database rules
        run: npx --yes firebase-tools@13.35.1 deploy --only database --project cpl-auction --non-interactive
